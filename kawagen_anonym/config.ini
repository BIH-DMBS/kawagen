# Configuration for link_plz_nuts3.py
#
# Relative paths are resolved relative to the folder containing this file.
# Absolute paths (e.g. C:\Daten\FDPG) are used as given.

[input]
# Folder containing the three CSV files exported by the FDPG
input_dir = input_data

# File names inside input_dir (defaults = names as delivered by the FDPG)
patient_file = MII PR Person Patient (Pseudonymisiert).csv
diagnose_file = MII PR Diagnose Condition.csv
kontakt_file = MII PR Fall Kontakt mit einer Gesundheitseinrichtung.csv

[output]
# Result file
result_file = result.csv
